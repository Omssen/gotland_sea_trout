<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0b3d4d'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><title>Gotland Sea Trout</title><link rel='manifest' href='manifest.webmanifest'><link rel='icon' href='icon.svg' type='image/svg+xml'><link rel='apple-touch-icon' href='icon.svg'><link rel='stylesheet' href='styles.css'><link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'></head><body>
<header><div><strong>Gotland Sea Trout</strong><span>v4 · Live · Tagebuch · eigene Spots</span></div><button id='locateBtn' title='Mein Standort'>⌖</button></header>

<div id='ranking' class='ranking hidden'></div><div id='spotList'></div>
</section></main>
