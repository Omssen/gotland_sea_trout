<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Gotland Sea Trout</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<header><div><strong>Gotland Sea Trout</strong><span>v6.1 · Karte zuerst</span></div><div class="headBtns"><button id="baseBtn" title="Karte/Satellit">▱</button><button id="locateBtn" title="Mein Standort">⌖</button></div></header>

<div id="sheet" class="sheet hidden"><div class="sheetCard"><div class="grab"></div><button id="closeSheet" class="closeBtn">×</button><div id="sheetBody"></div></div></div>
<input id="importFile" type="file" accept="application/json" hidden><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
