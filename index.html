<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3d4d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Gotland Sea Trout</title><link rel="manifest" href="manifest.webmanifest?v=6113"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css?v=6113"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"></head><body>
<header><div><strong>Gotland Sea Trout <small class="versionBadge">v6.1.14 TEST</small></strong><span>Datenfläche · Landoverlay · Trübung</span></div><div class="headBtns"><button id="baseBtn" title="Karte/Satellit">▱</button><button id="locateBtn" title="Mein Standort">⌖</button></div></header>
