Name: GitHub Pages bereitstellen

An:
  drücken:
    Branches: ["main", "v6-test"]
  Workflow-Versand:

Berechtigungen:
  Inhalt: lesen
  Seiten: schreiben
  id-token: schreiben

Gleichzeitigkeit:
  Gruppe: Seiten
  Abbruch während des Vorgangs: wahr

Jobs:
  einsetzen:
    Umfeld:
      Name: github-pages
      URL: ${{ steps.deployment.outputs.page_url }}
    läuft auf: ubuntu-latest

    Schritte:
      - Name: Haupt-Checkout
        Verwendung: actions/checkout@v4
        mit:
          ref: main
          Pfad: Website

      - Name: Checkout v6-Test
        Verwendung: actions/checkout@v4
        mit:
          Referenz: v6-Test
          Pfad: v6test

      - Name: Testversion v6 hinzufügen
        Ausführung: |
          mkdir -p site/v6-test
          cp -R v6test/* site/v6-test/

      - Name: Einrichtungsseiten
        Verwendung: actions/configure-pages@v5

      - Name: Upload-Seite
        Verwendung: actions/upload-pages-artifact@v3
        mit:
          Pfad: Website

      - Name: Bereitstellen
        ID: Bereitstellung
        Verwendung: actions/deploy-pages@v4
