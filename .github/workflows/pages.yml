name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "v6-test"]

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: pages

  cancel-in-progress: true

jobs:

  deploy:

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout main

        uses: actions/checkout@v4

        with:

          ref: main

          path: site

      - name: Checkout v6-test

        uses: actions/checkout@v4

        with:

          ref: v6-test

          path: v6test

      - name: Add v6 test version

        run: |

          mkdir -p site/v6-test

          cp -R v6test/* site/v6-test/

      - name: Setup Pages

        uses: actions/configure-pages@v5

      - name: Upload site

        uses: actions/upload-pages-artifact@v3

        with:

          path: site

      - name: Deploy

        id: deployment

        uses: actions/deploy-pages@v4
