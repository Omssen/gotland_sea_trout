name: DMI Hoburgen Current Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/dmi-hoburgen-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query DMI EDR at Hoburgen
        shell: bash
        run: |
          set -euo pipefail
          URL='https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_nsbs/position?coords=POINT%2818.110%2056.920%29&crs=crs84&parameter-name=current-u,current-v&f=GeoJSON'
          echo "Query: $URL"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 120 "$URL" -o dmi.json
          python - <<'PY'
          import json, math
          with open('dmi.json','r',encoding='utf-8') as f:
              d=json.load(f)
          feats=d.get('features',[])
          print('feature_count=',len(feats))
          rows=[]
          for ft in feats:
              p=ft.get('properties',{})
              u=p.get('current-u'); v=p.get('current-v'); step=p.get('step')
              if u is None or v is None: continue
              speed=math.hypot(u,v)
              direction=(math.degrees(math.atan2(u,v))+360)%360
              rows.append((step,u,v,speed,direction,ft.get('geometry',{}).get('coordinates')))
          print('valid_count=',len(rows))
          for r in rows[:20]:
              print(f"step={r[0]} u={r[1]:+.6f} v={r[2]:+.6f} speed={r[3]:.6f} dir_to={r[4]:.1f} coord={r[5]}")
          if not rows:
              raise SystemExit('No valid current-u/current-v rows returned')
          PY
