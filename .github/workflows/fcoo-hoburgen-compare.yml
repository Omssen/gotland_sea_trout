name: DMI Hoburgen surface-current comparison
on:
  push:
    branches: [v6-test]
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query DMI DKSS surface current
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_nsbs'
          pts=[('W',56.98,17.98),('SW',56.86,18.05),('S',56.79,18.22),('SE',56.84,18.48),('E',56.98,18.55)]
          params='current-u,current-v'
          out=[]
          for name,lat,lon in pts:
            q=urllib.parse.urlencode({'coords':f'POINT({lon} {lat})','crs':'crs84','parameter-name':params,'f':'GeoJSON'})
            url=base+'/position?'+q
            print('QUERY',name,url)
            with urllib.request.urlopen(url, timeout=60) as r:
              data=json.load(r)
            out.append({'point':name,'requested_lat':lat,'requested_lon':lon,'response':data})
          open('dmi-hoburgen.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dmi-hoburgen-surface-current
          path: dmi-hoburgen.json
